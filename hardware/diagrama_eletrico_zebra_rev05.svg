<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 700" font-family="Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="1150" height="700" fill="white"/>
<text x="575.0" y="34" font-size="17" fill="#111" text-anchor="middle" font-weight="bold">Diagrama elétrico · controlador de potência entre receptor e ESC</text>
<text x="575.0" y="55" font-size="11.5" fill="#666" text-anchor="middle">Zebra Aerodesign · quatro chicotes · barramento S.Port atravessa a placa · alimentação única pelo BEC do receptor</text>
<rect x="50" y="110" width="180" height="350" rx="8" fill="#f5f5f5" stroke="#999" stroke-width="2.2"/>
<text x="140" y="148" font-size="14" fill="#111" text-anchor="middle" font-weight="bold">Receptor</text>
<text x="140" y="168" font-size="10.5" fill="#666" text-anchor="middle">FrSky Archer R12+</text>
<text x="216" y="204" font-size="11" fill="#111" text-anchor="end" font-weight="bold">Porta SBUS</text>
<text x="216" y="334" font-size="11" fill="#111" text-anchor="end" font-weight="bold">Porta S.Port</text>
<text x="216" y="376" font-size="11" fill="#111" text-anchor="end" font-weight="bold">+5 V (BEC)</text>
<text x="216" y="428" font-size="11" fill="#111" text-anchor="end" font-weight="bold">GND</text>
<circle cx="230" cy="200" r="4.5" fill="#1565c0"/>
<circle cx="230" cy="330" r="4.5" fill="#e65100"/>
<circle cx="230" cy="372" r="4.5" fill="#c62828"/>
<circle cx="230" cy="424" r="4.5" fill="#111"/>
<rect x="390" y="110" width="370" height="350" rx="8" fill="#fcfbf7" stroke="#b8860b" stroke-width="2.2"/>
<text x="575" y="138" font-size="12.5" fill="#8a6d0b" text-anchor="middle" font-weight="bold">Placa do controlador · rev05</text>
<rect x="465" y="160" width="210" height="105" rx="8" fill="#eef3fb" stroke="#1a3a6b" stroke-width="2.2"/>
<text x="570" y="196" font-size="13" fill="#1a3a6b" text-anchor="middle" font-weight="bold">ESP32 DevKit V1</text>
<text x="570" y="216" font-size="10.5" fill="#666" text-anchor="middle">feedforward + PID</text>
<text x="398" y="187" font-size="11.5" fill="#8a6d0b" text-anchor="start" font-weight="bold">J2</text>
<text x="398" y="317" font-size="11.5" fill="#8a6d0b" text-anchor="start" font-weight="bold">J1</text>
<text x="752" y="187" font-size="11.5" fill="#8a6d0b" text-anchor="end" font-weight="bold">J3</text>
<text x="752" y="317" font-size="11.5" fill="#8a6d0b" text-anchor="end" font-weight="bold">J4</text>
<rect x="920" y="110" width="180" height="350" rx="8" fill="#f5f5f5" stroke="#999" stroke-width="2.2"/>
<text x="1010" y="148" font-size="14" fill="#111" text-anchor="middle" font-weight="bold">ESC</text>
<text x="1010" y="168" font-size="10.5" fill="#666" text-anchor="middle">Scorpion Tribunus III</text>
<text x="934" y="204" font-size="11" fill="#111" text-anchor="start" font-weight="bold">Entrada Master</text>
<text x="934" y="334" font-size="11" fill="#111" text-anchor="start" font-weight="bold">Porta S.Port</text>
<text x="934" y="428" font-size="11" fill="#111" text-anchor="start" font-weight="bold">GND</text>
<circle cx="920" cy="200" r="4.5" fill="#2e7d32"/>
<circle cx="920" cy="330" r="4.5" fill="#e65100"/>
<circle cx="920" cy="424" r="4.5" fill="#111"/>
<path d="M934,365 l13,13 M947,365 l-13,13" stroke="#c62828" stroke-width="2.4"/>
<text x="958" y="376" font-size="10" fill="#666" text-anchor="start">+ (BEC) não conectado</text>
<line x1="230" y1="200" x2="390" y2="200" stroke="#1565c0" stroke-width="2.4" stroke-linecap="square"/>
<text x="310" y="188" font-size="10.5" fill="#1565c0" text-anchor="middle" font-weight="bold">SBUS</text>
<line x1="230" y1="330" x2="390" y2="330" stroke="#e65100" stroke-width="2.4" stroke-linecap="square"/>
<line x1="230" y1="372" x2="390" y2="372" stroke="#c62828" stroke-width="2.4" stroke-linecap="square"/>
<text x="310" y="362" font-size="10.5" fill="#c62828" text-anchor="middle" font-weight="bold">+5 V (BEC)</text>
<line x1="760" y1="200" x2="920" y2="200" stroke="#2e7d32" stroke-width="2.4" stroke-linecap="square"/>
<text x="840" y="188" font-size="10.5" fill="#2e7d32" text-anchor="middle" font-weight="bold">PWM 1000–2000 µs</text>
<line x1="760" y1="330" x2="920" y2="330" stroke="#e65100" stroke-width="2.4" stroke-linecap="square"/>
<text x="840" y="318" font-size="10.5" fill="#e65100" text-anchor="middle" font-weight="bold">S.Port</text>
<line x1="230" y1="424" x2="920" y2="424" stroke="#111" stroke-width="2.4" stroke-linecap="square"/>
<text x="300" y="412" font-size="10.5" fill="#111" text-anchor="middle" font-weight="bold">GND comum</text>
<line x1="390" y1="200" x2="465" y2="200" stroke="#1565c0" stroke-width="2.4" stroke-linecap="square"/>
<line x1="675" y1="200" x2="760" y2="200" stroke="#2e7d32" stroke-width="2.4" stroke-linecap="square"/>
<line x1="390" y1="330" x2="760" y2="330" stroke="#e65100" stroke-width="2.6" stroke-linecap="square"/>
<line x1="570" y1="330" x2="570" y2="265" stroke="#e65100" stroke-width="2.4" stroke-linecap="square"/>
<circle cx="570" cy="330" r="4.5" fill="#e65100"/>
<rect x="561" y="278" width="18" height="44" rx="2" fill="white" stroke="#e65100" stroke-width="2"/>
<text x="585" y="304" font-size="10.5" fill="#111" text-anchor="start">R2</text>
<line x1="390" y1="372" x2="430" y2="372" stroke="#c62828" stroke-width="2.4" stroke-linecap="square"/>
<line x1="430" y1="372" x2="430" y2="232" stroke="#c62828" stroke-width="2.4" stroke-linecap="square"/>
<line x1="430" y1="232" x2="465" y2="232" stroke="#c62828" stroke-width="2.4" stroke-linecap="square"/>
<line x1="640" y1="265" x2="640" y2="424" stroke="#111" stroke-width="2.4" stroke-linecap="square"/>
<circle cx="640" cy="424" r="4.5" fill="#111"/>
<line x1="50" y1="520" x2="1100" y2="520" stroke="#ddd" stroke-width="1"/>
<line x1="50" y1="552" x2="80" y2="552" stroke="#1565c0" stroke-width="3" stroke-linecap="square"/>
<text x="88" y="556" font-size="11" fill="#111" text-anchor="start">SBUS 100 kbaud inv.</text>
<line x1="229.3" y1="552" x2="259.3" y2="552" stroke="#e65100" stroke-width="3" stroke-linecap="square"/>
<text x="267.3" y="556" font-size="11" fill="#111" text-anchor="start">S.Port 57600 8N1 inv.</text>
<line x1="422.0" y1="552" x2="452.0" y2="552" stroke="#2e7d32" stroke-width="3" stroke-linecap="square"/>
<text x="460.0" y="556" font-size="11" fill="#111" text-anchor="start">PWM 200 Hz</text>
<line x1="541.0" y1="552" x2="571.0" y2="552" stroke="#c62828" stroke-width="3" stroke-linecap="square"/>
<text x="579.0" y="556" font-size="11" fill="#111" text-anchor="start">Alimentação +5 V</text>
<line x1="700.2" y1="552" x2="730.2" y2="552" stroke="#111" stroke-width="3" stroke-linecap="square"/>
<text x="738.2" y="556" font-size="11" fill="#111" text-anchor="start">GND comum</text>
<text x="50" y="596" font-size="11" fill="#666" text-anchor="start">Quatro chicotes: J1 leva S.Port, 5 V e GND do receptor (3 fios); J2 leva o SBUS (2 fios); J3 entrega o PWM ao ESC (2 fios); J4 devolve o S.Port ao ESC (2 fios).</text>
<text x="50" y="620" font-size="11" fill="#666" text-anchor="start">O barramento S.Port entra por J1 e sai por J4 sem nada em série. O ESP32 não é mestre: escuta em paralelo pela derivação de R2, e o R12+ segue fazendo o polling.</text>
<text x="50" y="644" font-size="11" fill="#666" text-anchor="start">Os positivos do lado do ESC ficam desconectados, para manter um ponto único de alimentação e evitar conflito entre reguladores.</text>
</svg>